<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | QR code component</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>

  
  <body>
    <!-- <div class="card-container"> -->
      <div class="bg-[#FFFFFF] rounded-lg flex flex-col items-center w-80 sm:w-96 p-10">
      <img class="rounded-lg w-80 h-80 sm:w-96" src="images/image-qr-code.png" alt="qr-code" />
      <h3 class="mb-0 p-2 font-[600] text-15px text-[#1F3251]">Improve your front-end skills by building projects</h3>
      <p class="text-[#68778d] p-2 mt-0">scan the code to visit front-end Mentor and take your coding skills to the next level</p>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
